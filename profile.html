<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Профиль — Guard VPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wave-bg">
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
    </div>

    <div class="container">
        <div class="theme-switch-wrapper">
            <label class="theme-switch">
                <input type="checkbox" id="themeToggle" onchange="toggleTheme()">
                <span class="slider"></span>
            </label>
        </div>

        <button class="back-btn" onclick="goBack()">← На главную</button>

        <!-- Аватар и имя -->
        <div class="profile-header">
            <div class="profile-avatar" id="profileAvatar">👤</div>
            <h2 id="profileName">Загрузка...</h2>
            <p id="profileUsername">@username</p>
        </div>

        <!-- Статистика подписки -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="subscriptionStatus">—</div>
                <div class="stat-label">Статус</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="daysLeft">—</div>
                <div class="stat-label">Дней осталось</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="expiryDate">—</div>
                <div class="stat-label">Действует до</div>
            </div>
        </div>

        <!-- Прогресс-бар подписки -->
        <div class="progress-section">
            <div class="progress-label">
                <span>📅 Прогресс подписки</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
            </div>
        </div>

        <!-- Информация о пользователе -->
        <div class="info-card">
            <div class="info-row">
                <span>🆔 ID</span>
                <span id="userId">—</span>
            </div>
            <div class="info-row">
                <span>📅 Дата регистрации</span>
                <span id="regDate">—</span>
            </div>
        </div>

        <!-- Кнопки действий -->
        <button class="btn btn-primary" id="renewBtn" style="display: none;">
            🔄 Продлить подписку
        </button>
        <button class="btn btn-secondary" onclick="refreshProfile()">
            🔄 Обновить профиль
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const initData = tg.initData;
        const initDataUnsafe = tg.initDataUnsafe;
        const userId = initDataUnsafe.user?.id;
        const userName = initDataUnsafe.user?.first_name || "Пользователь";
        const userUsername = initDataUnsafe.user?.username || "";

        const API_BASE = "https://ТВОЙ_ДОМЕН/api";

        async function callAPI(endpoint, method = 'GET', body = null) {
            const headers = {
                'Content-Type': 'application/json',
                'X-Telegram-Init-Data': initData
            };
            const options = { method, headers };
            if (body) options.body = JSON.stringify(body);
            const response = await fetch(`${API_BASE}/${endpoint}`, options);
            return response.json();
        }

        async function loadProfile() {
            try {
                const data = await callAPI('user/profile');
                
                document.getElementById('profileName').innerText = userName;
                document.getElementById('profileUsername').innerText = userUsername ? `@${userUsername}` : '';
                document.getElementById('userId').innerText = userId || '—';
                document.getElementById('regDate').innerText = data.reg_date || '—';
                
                const statusEl = document.getElementById('subscriptionStatus');
                const daysLeftEl = document.getElementById('daysLeft');
                const expiryDateEl = document.getElementById('expiryDate');
                const renewBtn = document.getElementById('renewBtn');
                const progressFill = document.getElementById('progressFill');
                const progressPercent = document.getElementById('progressPercent');
                
                if (data.has_subscription && data.expiry_date) {
                    statusEl.innerHTML = '✅ Активна';
                    statusEl.style.color = '#22c55e';
                    expiryDateEl.innerText = data.expiry_date;
                    
                    const daysLeft = data.days_left || 0;
                    daysLeftEl.innerText = daysLeft;
                    
                    const totalDays = data.total_days || 30;
                    const percent = Math.min(100, Math.max(0, (daysLeft / totalDays) * 100));
                    progressFill.style.width = `${percent}%`;
                    progressPercent.innerText = `${Math.round(percent)}%`;
                    
                    if (percent < 20) {
                        progressFill.style.background = 'linear-gradient(135deg, #ef4444, #dc2626)';
                    } else if (percent < 50) {
                        progressFill.style.background = 'linear-gradient(135deg, #f59e0b, #d97706)';
                    } else {
                        progressFill.style.background = 'linear-gradient(135deg, #22c55e, #16a34a)';
                    }
                    
                    renewBtn.style.display = 'block';
                } else {
                    statusEl.innerHTML = '❌ Неактивна';
                    statusEl.style.color = '#ef4444';
                    daysLeftEl.innerText = '0';
                    expiryDateEl.innerText = '—';
                    progressFill.style.width = '0%';
                    progressPercent.innerText = '0%';
                    renewBtn.style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading profile:', error);
            }
        }

        async function refreshProfile() {
            const btn = event.target;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="loader-spinner"></span> Загрузка...';
            btn.disabled = true;
            await loadProfile();
            btn.innerHTML = originalText;
            btn.disabled = false;
            tg.showAlert('✅ Профиль обновлён!');
        }

        function goBack() {
            window.location.href = 'index.html';
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-theme');
                const themeToggle = document.getElementById('themeToggle');
                if (themeToggle) themeToggle.checked = true;
            }
        }

        function toggleTheme() {
            if (document.body.classList.contains('light-theme')) {
                document.body.classList.remove('light-theme');
                localStorage.setItem('theme', 'dark');
            } else {
                document.body.classList.add('light-theme');
                localStorage.setItem('theme', 'light');
            }
        }

        initTheme();
        loadProfile();

        tg.MainButton.setText("Закрыть");
        tg.MainButton.onClick(() => tg.close());
        tg.MainButton.show();
    </script>
</body>
</html>
